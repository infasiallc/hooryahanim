<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Hooriya Hanım — Horizontal Lockup</title>
  <desc id="desc">Horizontal logo lockup: Sydney Opera House sail and crest emblem on the left, Playfair wordmark on the right.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&amp;display=swap');
      .wordmark { font-family: 'Playfair Display', 'Didot', Georgia, serif; font-weight: 400; }
      .subname { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; }
      .tagline { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; }
      .monogram { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <!-- LEFT: Compact sail-and-crest emblem -->
  <g transform="translate(120, 35)">
    <!-- Sydney Opera House — minimalist sail silhouette -->
    <g transform="translate(0, 0)">
      <path d="M -38.48 14.00 C -39.31 7.76 -32.14 -1.60 -30.16 -1.60 C -28.65 -1.60 -23.40 9.94 -23.92 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -32.24 14.00 C -33.28 3.18 -24.34 -13.04 -21.84 -13.04 C -19.86 -13.04 -12.84 6.98 -13.52 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -22.88 14.00 C -24.23 -0.98 -12.58 -23.44 -9.36 -23.44 C -7.12 -23.44 0.73 4.28 0.00 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -3.12 14.00 C -4.16 2.77 4.78 -14.08 7.28 -14.08 C 9.78 -14.08 18.51 6.72 17.68 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 12.48 14.00 C 11.54 6.51 19.60 -4.72 21.84 -4.72 C 23.82 -4.72 30.84 9.11 30.16 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 24.96 14.00 C 24.23 9.84 30.47 3.60 32.24 3.60 C 33.49 3.60 37.86 11.30 37.44 14.00 Z" fill="none" stroke="#6B1A2C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="-42" y1="18" x2="42" y2="18" stroke="#6B1A2C" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="1.6" fill="#B8860B"/>
    </g>

    <!-- Crest circle -->
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#6B1A2C" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#6B1A2C" stroke-width="0.3"/>
      <text class="monogram" x="0" y="22" text-anchor="middle" font-size="92" fill="#6B1A2C">H</text>
      <line x1="-18" y1="38" x2="18" y2="38" stroke="#B8860B" stroke-width="0.6"/>
      <circle cx="0" cy="38" r="1.7" fill="#B8860B"/>
    </g>
  </g>

  <!-- RIGHT: Wordmark -->
  <g transform="translate(280, 0)">
    <!-- Top divider -->
    <line x1="0" y1="80" x2="600" y2="80" stroke="#B8860B" stroke-width="0.4"/>

    <!-- HOORIYA -->
    <text class="wordmark" x="300" y="135" text-anchor="middle" font-size="66" letter-spacing="12" fill="#6B1A2C">HOORIYA</text>

    <!-- Hanım with side rules -->
    <g transform="translate(300, 178)">
      <line x1="-115" y1="0" x2="-58" y2="0" stroke="#B8860B" stroke-width="0.4"/>
      <line x1="58" y1="0" x2="115" y2="0" stroke="#B8860B" stroke-width="0.4"/>
      <text class="subname" x="0" y="10" text-anchor="middle" font-size="34" fill="#B8860B">Hanım</text>
    </g>

    <!-- Bottom divider with tagline -->
    <line x1="0" y1="210" x2="600" y2="210" stroke="#B8860B" stroke-width="0.4"/>
    <text class="tagline" x="300" y="228" text-anchor="middle" font-size="11" letter-spacing="6" fill="#6B1A2C">A PAKISTANI HOUSE OF COUTURE · ISLAMABAD</text>
  </g>
</svg>
