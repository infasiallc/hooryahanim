<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Hooriya Hanım — Primary Logo</title>
  <desc id="desc">Minimalist Sydney Opera House sail silhouette above a circular crest framing an italic H monogram, paired with the Hooriya Hanım wordmark. A Pakistani house of couture.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400;1,500&amp;display=swap');
      .wordmark { font-family: 'Playfair Display', 'Didot', 'Bodoni 72', Georgia, serif; font-weight: 400; }
      .subname { font-family: 'Playfair Display', 'Didot', Georgia, serif; font-style: italic; font-weight: 400; }
      .tagline { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; }
      .monogram { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <!-- SYDNEY OPERA HOUSE — minimalist sail silhouette -->
  <g transform="translate(300, 70)">
    <path d="M -81.40 32.00 C -83.16 18.80 -67.98 -1.00 -63.80 -1.00 C -60.61 -1.00 -49.50 23.42 -50.60 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -68.20 32.00 C -70.40 9.12 -51.48 -25.20 -46.20 -25.20 C -42.02 -25.20 -27.17 17.15 -28.60 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -48.40 32.00 C -51.26 0.32 -26.62 -47.20 -19.80 -47.20 C -15.07 -47.20 1.54 11.43 0.00 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -6.60 32.00 C -8.80 8.24 10.12 -27.40 15.40 -27.40 C 20.68 -27.40 39.16 16.60 37.40 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 26.40 32.00 C 24.42 16.16 41.47 -7.60 46.20 -7.60 C 50.38 -7.60 65.23 21.66 63.80 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 52.80 32.00 C 51.26 23.20 64.46 10.00 68.20 10.00 C 70.84 10.00 80.08 26.28 79.20 32.00 Z" fill="none" stroke="#6B1A2C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Podium base rule with gold accent dot -->
    <line x1="-88" y1="36" x2="88" y2="36" stroke="#6B1A2C" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="36" r="2.2" fill="#B8860B"/>
  </g>

  <!-- CREST CIRCLE with Mughal 8-point dot pattern -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#6B1A2C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="122" fill="none" stroke="#B8860B" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="116" fill="none" stroke="#6B1A2C" stroke-width="0.4"/>

    <!-- 8-point star dots (Mughal jali geometry) -->
    <g fill="#B8860B">
      <circle cx="0" cy="-119" r="2"/>
      <circle cx="84.1" cy="-84.1" r="2"/>
      <circle cx="119" cy="0" r="2"/>
      <circle cx="84.1" cy="84.1" r="2"/>
      <circle cx="0" cy="119" r="2"/>
      <circle cx="-84.1" cy="84.1" r="2"/>
      <circle cx="-119" cy="0" r="2"/>
      <circle cx="-84.1" cy="-84.1" r="2"/>
    </g>

    <!-- Curved top text — Pakistani house of couture -->
    <defs>
      <path id="topArc" d="M -95 -25 A 100 100 0 0 1 95 -25" fill="none"/>
      <path id="bottomArc" d="M -90 35 A 95 95 0 0 0 90 35" fill="none"/>
    </defs>
    <text class="wordmark" font-size="11" letter-spacing="6" fill="#6B1A2C">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">HOUSE OF COUTURE</textPath>
    </text>
    <text class="tagline" font-size="11" letter-spacing="4" fill="#B8860B">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">est. islamabad</textPath>
    </text>

    <!-- Paisley side flourishes -->
    <g stroke="#B8860B" stroke-width="0.8" fill="none">
      <path d="M -110 -8 C -116 -2, -114 6, -106 8 C -108 2, -104 -4, -110 -8 Z"/>
      <path d="M 110 -8 C 116 -2, 114 6, 106 8 C 108 2, 104 -4, 110 -8 Z"/>
    </g>

    <!-- H MONOGRAM -->
    <text class="monogram" x="0" y="40" text-anchor="middle" font-size="170" fill="#6B1A2C">H</text>

    <!-- Underline with paisley dot -->
    <line x1="-30" y1="62" x2="-6" y2="62" stroke="#B8860B" stroke-width="0.8"/>
    <line x1="6" y1="62" x2="30" y2="62" stroke="#B8860B" stroke-width="0.8"/>
    <circle cx="0" cy="62" r="2.2" fill="#B8860B"/>
  </g>

  <!-- DECORATIVE DIVIDER — paisley row -->
  <g transform="translate(300, 490)">
    <line x1="-90" y1="0" x2="-18" y2="0" stroke="#B8860B" stroke-width="0.6"/>
    <line x1="18" y1="0" x2="90" y2="0" stroke="#B8860B" stroke-width="0.6"/>
    <g fill="none" stroke="#6B1A2C" stroke-width="0.8">
      <path d="M -12 0 C -14 -3, -10 -5, -7 -3 C -9 -1, -10 1, -12 0 Z"/>
      <path d="M 12 0 C 14 -3, 10 -5, 7 -3 C 9 -1, 10 1, 12 0 Z"/>
    </g>
    <circle cx="0" cy="0" r="2.2" fill="#6B1A2C"/>
  </g>

  <!-- WORDMARK: HOORIYA -->
  <text class="wordmark" x="300" y="570" text-anchor="middle" font-size="78" letter-spacing="12" fill="#6B1A2C">HOORIYA</text>

  <!-- SUB-NAME: Hanım with side rules -->
  <g transform="translate(300, 625)">
    <line x1="-95" y1="0" x2="-48" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="95" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <text class="subname" x="0" y="10" text-anchor="middle" font-size="42" fill="#B8860B">Hanım</text>
  </g>

  <!-- TAGLINE -->
  <text class="tagline" x="300" y="700" text-anchor="middle" font-size="13" letter-spacing="8" fill="#6B1A2C">A PAKISTANI HOUSE OF COUTURE</text>

</svg>
