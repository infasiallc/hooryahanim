<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-labelledby="title desc">
  <title id="title">Hooriya Hanım — Wordmark Only</title>
  <desc id="desc">Wordmark-only version of the Hooriya Hanım logo in Playfair Display, for narrow horizontal placements.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap');
      .wordmark { font-family: 'Playfair Display', 'Didot', Georgia, serif; font-weight: 400; }
      .subname { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <!-- Top ornamental divider with paisley accents -->
  <g transform="translate(350, 32)">
    <line x1="-130" y1="0" x2="-14" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <line x1="14" y1="0" x2="130" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <path d="M -8 0 C -10 -3, -6 -5, -3 -3 C -5 -1, -6 1, -8 0 Z" fill="#6B1A2C"/>
    <circle cx="0" cy="0" r="2.5" fill="#6B1A2C"/>
    <path d="M 8 0 C 10 -3, 6 -5, 3 -3 C 5 -1, 6 1, 8 0 Z" fill="#6B1A2C"/>
  </g>

  <!-- HOORIYA -->
  <text class="wordmark" x="350" y="115" text-anchor="middle" font-size="80" letter-spacing="14" fill="#6B1A2C">HOORIYA</text>

  <!-- Hanım with side rules -->
  <g transform="translate(350, 168)">
    <line x1="-115" y1="0" x2="-55" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <line x1="55" y1="0" x2="115" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <text class="subname" x="0" y="11" text-anchor="middle" font-size="40" fill="#B8860B">Hanım</text>
  </g>

  <!-- Bottom ornamental divider -->
  <g transform="translate(350, 198)">
    <line x1="-130" y1="0" x2="-14" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <line x1="14" y1="0" x2="130" y2="0" stroke="#B8860B" stroke-width="0.5"/>
    <path d="M -8 0 C -10 -3, -6 -5, -3 -3 C -5 -1, -6 1, -8 0 Z" fill="#6B1A2C"/>
    <circle cx="0" cy="0" r="2.5" fill="#6B1A2C"/>
    <path d="M 8 0 C 10 -3, 6 -5, 3 -3 C 5 -1, 6 1, 8 0 Z" fill="#6B1A2C"/>
  </g>
</svg>
